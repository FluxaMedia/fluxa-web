<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Account — Fluxa</title>
<meta name="description" content="Sign in to manage your Fluxa account — profiles, addons, plugins, library, and settings for Stremio and Nuvio." />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" sizes="48x48" href="favicon.png" />
<link rel="apple-touch-icon" href="logo.png" />
<link rel="stylesheet" href="account.css" />
</head>
<body>

<nav class="page-nav">
  <button class="panel-menu-btn" id="panel-menu-btn" aria-label="Toggle menu">
    <i data-lucide="menu" style="width:18px;height:18px"></i>
  </button>
  <a class="brand" href="index.html">
    <img src="logo.png" alt="Fluxa" />
    <span class="brand-name">Fluxa</span>
    <span class="brand-tag">Account</span>
  </a>
  <div class="spacer"></div>
  <a class="nav-back" href="index.html"><i data-lucide="arrow-left" style="width:15px;height:15px"></i> <span>Back to site</span></a>
</nav>

<div id="app"></div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <p id="modal-body"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
      <button class="btn btn-danger" id="modal-confirm">Confirm</button>
    </div>
  </div>
</div>

<script src="lucide.min.js"></script>
<script src="account-api.js"></script>
<script src="account.js"></script>
</body>
</html>
